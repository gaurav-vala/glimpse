name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🏗️ Expo Prebuild (Generate Android Native Project)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Release APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📦 Locate and rename APK
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          DEST_APK="glimpse-${TAG}.apk"
          cp "$APK_PATH" "$DEST_APK"
          echo "apk_path=$DEST_APK" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Release ${{ steps.apk.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
